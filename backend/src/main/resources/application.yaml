spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/checkticket
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  # Configura aquí un SMTP real para habilitar el envío de correos (spring-boot-starter-mail):
